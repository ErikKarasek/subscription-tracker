name = "subscription-tracker"
main = "server/worker.ts"
compatibility_date = "2025-01-01"

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "subscription-tracker-db"
database_id = "fb541d14-ef20-40ad-bbf1-57ff7adad89e"

[vars]
# Where renewal/unused-subscription reminder emails go. Change to your own address.
REMINDER_TO_EMAIL = "erikkarasek@centrum.cz"

# Daily 07:00 UTC: advance renewals, send reminder emails via Resend (RESEND_API_KEY secret).
[triggers]
crons = ["0 7 * * *"]
